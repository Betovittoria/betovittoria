<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <!-- Top Border Line Gradient -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="858" height="238" rx="14" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.2" />
  <rect x="1" y="1" width="858" height="238" rx="14" fill="url(#cyanGlow)" />
  <rect x="1" y="1" width="858" height="238" rx="14" fill="url(#grid)" />

  <!-- Top Accent Beam -->
  <path d="M 24 1.5 L 836 1.5" stroke="url(#topLine)" stroke-width="2" stroke-linecap="round" />

  <!-- Monospace Header Tag -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="290" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">AVAILABLE FOR CLIENT WORK</text>
  </g>

  <!-- Name / Title -->
  <text x="48" y="125" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em">
    Wilson Victoria
  </text>
  <text x="325" y="125" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300" letter-spacing="-0.02em">
    /
  </text>
  <text x="348" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    Full-Stack Web Developer &amp; AI Practitioner
  </text>

  <!-- Subtitle / Hook -->
  <text x="48" y="165" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Crafting high-conversion frontend interfaces, resilient system architectures &amp; modern digital products.
  </text>

  <!-- Badges / Pillars Bottom -->
  <g transform="translate(48, 195)">
    <text x="0" y="11" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', monospace" font-size="12" font-weight="500">
      <tspan fill="#38BDF8">◆</tspan> Next.js &amp; Astro &nbsp;&nbsp;
      <tspan fill="#818CF8">◆</tspan> Component-Driven Architecture &nbsp;&nbsp;
      <tspan fill="#34D399">◆</tspan> Sub-Second Performance &nbsp;&nbsp;
      <tspan fill="#F472B6">◆</tspan> AI-Augmented Workflows
    </text>
  </g>
</svg>
